name: Android APK

# Gera o APK de release do Hakuna Connect com o nome padrao de distribuicao:
# legendarios<versao>.apk (ex: legendarios1.0.6.apk). A versao sai do
# pubspec.yaml, entao basta bumpar la que o nome do arquivo acompanha.
#
# O APK fica disponivel de duas formas:
#   1. como artifact da execucao (aba Actions)
#   2. como anexo de uma Release, quando a execucao e disparada por uma tag v*
#
# ASSINATURA
#
# build.gradle.kts procura chave de producao em key.properties ou nas
# variaveis de ambiente abaixo. Enquanto os secrets nao existirem, o APK
# continua saindo assinado com a chave de DEBUG: instala num aparelho com
# "fontes desconhecidas" liberado (o fluxo de distribuicao por Drive) e nao
# serve para a Play Store.
#
# Para assinar de verdade, criar estes 4 secrets no repositorio:
#   ANDROID_KEYSTORE_BASE64   o .jks inteiro em base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Gerar o keystore (uma vez, e guardar o arquivo em lugar seguro — perder e
# irreversivel):
#   keytool -genkey -v -keystore legendarios.jks -keyalg RSA \
#           -keysize 2048 -validity 10000 -alias legendarios
#   base64 -w0 legendarios.jks        # o valor do secret
#
# AVISO: trocar a chave muda a identidade do app para o Android. Quem ja tem
# o legendarios1.0.x instalado precisara DESINSTALAR antes de atualizar.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Necessario pro passo de Release conseguir criar a release e anexar o
    # APK. Sem isso o build passa e o artifact sai, mas a release falha com
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Le a versao do pubspec
        id: versao
        run: |
          LINHA=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSAO=$(echo "$LINHA" | cut -d'+' -f1)
          # O `+N` e o versionCode do Android, e e por ELE que o app decide
          # se esta desatualizado (como texto, "1.0.9" > "1.0.10"). Sem ele
          # nao da para escrever em `app_versions`.
          BUILD=$(echo "$LINHA" | cut -d'+' -f2)
          if [ "$BUILD" = "$VERSAO" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec.yaml sem o '+N' em version: ($LINHA). O           build_number e obrigatorio para publicar a versao."
            exit 1
          fi
          echo "numero=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "arquivo=legendarios${VERSAO}.apk" >> "$GITHUB_OUTPUT"
          echo "Versao detectada: $VERSAO+$BUILD -> legendarios${VERSAO}.apk"

      - run: flutter pub get

      - name: Analise estatica
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Prepara o keystore de producao (se o secret existir)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # `tr -d` antes de decodificar: o secret pode chegar com CR,
            # quebra de linha ou espaco dependendo de como foi colado. O
            # `base64 -d` do GNU recusa qualquer um deles com "invalid
            # input" - foi o que derrubou a build da v1.0.21, porque o
            # PowerShell injeta CRLF ao canalizar para o `gh secret set`.
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d \
              > "$RUNNER_TEMP/legendarios.jks"

            # Confere que saiu um keystore de verdade, e nao um arquivo
            # vazio ou lixo. Falhar aqui, com mensagem clara, e melhor que
            # falhar 8 minutos depois dentro do Gradle.
            if [ ! -s "$RUNNER_TEMP/legendarios.jks" ]; then
              echo "::error::keystore decodificado esta vazio - confira o secret ANDROID_KEYSTORE_BASE64"
              exit 1
            fi
            keytool -list -keystore "$RUNNER_TEMP/legendarios.jks" \
              -storepass "$KEYSTORE_PASS" >/dev/null 2>&1 || {
                echo "::error::keystore invalido ou senha errada - confira ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD"
                exit 1
              }

            echo "caminho=$RUNNER_TEMP/legendarios.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore de PRODUCAO preparado e validado."
          else
            echo "caminho=" >> "$GITHUB_OUTPUT"
            echo "Sem keystore: o APK sai assinado com a chave de DEBUG."
          fi

      # ---------------------------------------------------------------
      # O APK SO E COMPILADO EM TAG.
      #
      # Este repositorio e PRIVADO, e minuto de Actions em repo privado e
      # faturado. O fluxo de release faz dois pushes seguidos (main e
      # depois a tag), e as duas execucoes compilavam o mesmo APK: ~11 min
      # cada, ~22 min por versao. Foi assim nas v1.0.34, .35 e .36 — tres
      # versoes num dia, metade do gasto jogada fora. Apontado pelo dono
      # do projeto em 11/10/2026.
      #
      # `analyze` e `test` continuam rodando em TODO push na main: sao os
      # passos baratos e sao a rede que pega erro antes da tag (foi o que
      # pegou o `p.basenameWithoutExtension` dependente de SO na v1.0.31,
      # que passava no Windows e quebrava no Linux). O que ficou so na tag
      # e o Gradle, que e o caro.
      #
      # Para gerar APK sem criar tag, use "Run workflow" na aba Actions
      # (`workflow_dispatch`).
      - name: Build do APK (release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          # Vazios quando os secrets nao existem — e o build.gradle.kts cai
          # no fallback de debug. Config pela metade nao assina: ele exige
          # os quatro valores E o arquivo no lugar.
          LEGENDARIOS_KEYSTORE_PATH: ${{ steps.assinatura.outputs.caminho }}
          LEGENDARIOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEGENDARIOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGENDARIOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # `--split-per-abi` em vez de um APK universal. Nao e
          # otimizacao, sao duas necessidades medidas no APK da v1.0.39:
          #
          #   x86_64       27,1 MB  <- so serve para EMULADOR
          #   arm64-v8a    24,7 MB  <- todo celular desde ~2016
          #   armeabi-v7a  20,9 MB  <- 32 bits, aparelho antigo
          #   resto         4,8 MB
          #
          # 1. O universal da 76 MB e o Storage do plano free recusa
          #    acima de 50 MB. O arm64 sozinho da ~30 MB e cabe.
          # 2. Baixar 27 MB de x86_64 no mato e desperdicio puro.
          #
          # O CLAUDE.md ja apontava --split-per-abi como o caminho certo
          # "se o tamanho virar problema", e NAO desligar o bundling do
          # ML Kit, que e o que faz o QR funcionar sem rede.
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Diz com qual chave o APK foi assinado
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Confere o arm64, que e o arquivo que a equipe instala. Os
          # outros saem da MESMA invocacao do Gradle, com a mesma chave.
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK nao existe — o --split-per-abi mudou os nomes de saida?"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi

          # Confere no ARQUIVO, nao na configuracao: e o unico jeito de
          # saber o que realmente saiu.
          #
          # Precisa ser apksigner, nao keytool. `keytool -printcert
          # -jarfile` le apenas assinatura JAR v1 (META-INF/*.RSA), e o
          # Flutter assina com APK Signature Scheme v2/v3 apenas — entao
          # keytool nao acha nada e devolve vazio em silencio. Foi o que
          # aconteceu na v1.0.17: o passo existia e nao verificava nada.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner \
                      -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner nao encontrado — assinatura NAO verificada."
            exit 0
          fi

          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)

          # O apksigner mudou o rotulo e isso quebrou a guarda em silencio.
          # Versao antiga imprimia "Signer #1 certificate DN:"; a atual
          # imprime "V2 Signer: certificate DN:". O passo so procurava a
          # primeira forma, entao a confirmacao positiva NUNCA casava, o
          # fluxo caia no else, e toda release saia com
          # "::warning::Nao foi possivel ler o certificado" — mesmo
          # assinada corretamente. Achado na v1.0.39.
          #
          # Guarda que avisa errado e pior que guarda nenhuma: ela ensina
          # quem le o log a ignorar o aviso, e no dia em que a assinatura
          # DE FATO sair errada o aviso vai parecer igual aos outros.
          echo "$CERTS" | grep -iE 'certificate (DN|SHA-1|SHA-256)' || true

          # O SHA-1 da chave de PRODUCAO. E ele que os aparelhos ja
          # instalados exigem: APK assinado com outra chave recusa a
          # atualizacao com INSTALL_FAILED_UPDATE_INCOMPATIBLE e obriga a
          # desinstalar — o que APAGA A FILA OFFLINE, ou seja, apaga
          # atendimento que ainda nao subiu.
          #
          # Comparar o digest, e nao apenas "nao e debug", e o que
          # transforma este passo de informativo em verificacao: sem isto
          # um keystore de producao TROCADO passaria batido.
          SHA1_ESPERADO=0b992313832c54be2a0cb3ed0fde5611441d4b88
          SHA1_NO_APK=$(echo "$CERTS"             | grep -ioE 'certificate SHA-1 digest: *[0-9a-fA-F]{40}'             | grep -ioE '[0-9a-fA-F]{40}' | head -1             | tr 'A-Z' 'a-z')

          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::APK assinado com CHAVE DE DEBUG. Nao atualiza           por cima das versoes >= 1.0.23 e nao serve para Play Store."
            exit 1
          elif [ -z "$SHA1_NO_APK" ]; then
            echo "::warning::Nao foi possivel LER o SHA-1 do certificado.           O APK pode estar correto — foi a verificacao que falhou. Confira           a mao: apksigner verify --print-certs <apk>"
            echo "$CERTS"
          elif [ "$SHA1_NO_APK" = "$SHA1_ESPERADO" ]; then
            echo "APK assinado com a chave de PRODUCAO (SHA-1 confere)."
          else
            echo "::error::CHAVE ERRADA. Esperado $SHA1_ESPERADO, veio           $SHA1_NO_APK. Os aparelhos instalados NAO aceitam esta           atualizacao, e desinstalar apaga a fila offline."
            exit 1
          fi

      - name: Renomeia para o padrao de distribuicao
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          VERSAO: ${{ steps.versao.outputs.numero }}
        run: |
          cd build/app/outputs/flutter-apk

          # O arm64 fica SEM sufixo, com o nome de sempre
          # (legendarios<versao>.apk). E deliberado: quem baixa no
          # celular no campo nao deve ter de escolher arquitetura, e
          # esse e o arquivo certo para praticamente todo aparelho
          # desde 2016. Manter o nome tambem evita quebrar o que a
          # equipe ja conhece e o que o CHANGELOG registra.
          mv app-arm64-v8a-release.apk "legendarios${VERSAO}.apk"

          # O 32 bits ganha nome que se entende sem explicacao. E a
          # EXCECAO, nao a escolha — por isso nao disputa o nome
          # principal. Quem precisa dele e quem tentou o outro e viu
          # "app nao instalado".
          if [ -f app-armeabi-v7a-release.apk ]; then
            mv app-armeabi-v7a-release.apk "legendarios${VERSAO}-32bits.apk"
          fi

          # x86_64 e DESCARTADO: so roda em emulador. Publicar seria
          # oferecer 27 MB que ninguem da equipe consegue usar e dar a
          # alguem a chance de baixar o arquivo errado.
          rm -f app-x86_64-release.apk

          ls -lh *.apk

      - name: Publica o APK como artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: legendarios-${{ steps.versao.outputs.numero }}-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
          if-no-files-found: error

      # Tag OU disparo manual. O manual existe porque o ambiente de quem
      # mantem o app (sessao do Claude) nao consegue empurrar tags: aqui a
      # propria acao cria a tag `v<versao do pubspec>` no commit do build,
      # com a permissao do GITHUB_TOKEN. Em 28/10/2026 a v1.0.45 so saiu
      # assim.
      - name: Anexa o APK a uma Release (tag, ou disparo manual que cria a tag)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.numero }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

      # ----------------------------------------------------------------------
      # PUBLICA NO SUPABASE STORAGE E AVISA O APP
      #
      # Por que isto existe: o fluxo de distribuicao era Google Drive manual,
      # e em 12/10/2026 descobriu-se que NENHUM APK la jamais esteve
      # compartilhado — 1.0.35, 1.0.37, 1.0.38, 1.0.39 e as pastas, todos
      # fechados. O botao ATUALIZAR nunca funcionou para ninguem alem do
      # dono: quem tocava caia em "Solicitar acesso" do Google.
      #
      # Passo manual que precisa ser repetido a cada release e passo que vai
      # ser esquecido. Aqui o CI faz: sobe o arquivo e escreve a linha.
      #
      # TOLERANTE A FALHA de proposito (`continue-on-error`). Este passo
      # publica; ele nao constroi. Se o Storage estiver fora ou o secret
      # faltar, a release com o APK assinado tem de sair de qualquer forma —
      # da para publicar a mao depois. O contrario (derrubar uma release
      # pronta por causa de um upload) seria trocar o essencial pelo
      # acessorio.
      # ----------------------------------------------------------------------
      - name: Publica o APK no Supabase Storage e em app_versions
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARQUIVO: ${{ steps.versao.outputs.arquivo }}
          VERSAO: ${{ steps.versao.outputs.numero }}
          BUILD: ${{ steps.versao.outputs.build }}
        run: |
          if [ -z "$SERVICE_ROLE" ]; then
            echo "::warning::Secret SUPABASE_SERVICE_ROLE_KEY ausente — o APK           NAO foi publicado. A release saiu, mas o botao ATUALIZAR nao vai           apontar para esta versao. Crie o secret para automatizar."
            exit 0
          fi

          APK="build/app/outputs/flutter-apk/$ARQUIVO"
          TAMANHO=$(stat -c%s "$APK")
          echo "Arquivo: $ARQUIVO ($((TAMANHO / 1048576)) MB)"

          # O plano FREE do Supabase Storage recusa acima de 50 MB, e o APK
          # universal tem 76 MB (o modelo do ML Kit vai embutido para o QR
          # funcionar sem rede). Falhar aqui com a causa escrita e melhor que
          # receber um 413 cru do Storage.
          LIMITE=$((50 * 1024 * 1024))
          if [ "$TAMANHO" -gt "$LIMITE" ]; then
            echo "::warning::APK tem $((TAMANHO / 1048576)) MB e o limite do           plano free do Supabase Storage e 50 MB. NAO publicado. Saidas:           build com --split-per-abi (o arm64 sozinho da ~30 MB) ou plano Pro."
            exit 0
          fi

          # `x-upsert: true` para reenviar a mesma tag sem erro de duplicata.
          COD=$(curl -s -o /tmp/up.txt -w '%{http_code}'             -X POST "$SUPABASE_URL/storage/v1/object/apks/$ARQUIVO"             -H "Authorization: Bearer $SERVICE_ROLE"             -H "Content-Type: application/vnd.android.package-archive"             -H "x-upsert: true"             --data-binary "@$APK")
          if [ "$COD" != "200" ] && [ "$COD" != "201" ]; then
            echo "::warning::Upload falhou (HTTP $COD). Resposta:"
            cat /tmp/up.txt
            exit 0
          fi

          URL="$SUPABASE_URL/storage/v1/object/public/apks/$ARQUIVO"
          echo "Publicado em: $URL"

          # `resolution=merge-duplicates` = upsert na chave primaria
          # (`version`). Sem isso, reenviar a tag devolve 409 e a linha fica
          # apontando para o arquivo antigo.
          COD=$(curl -s -o /tmp/ins.txt -w '%{http_code}'             -X POST "$SUPABASE_URL/rest/v1/app_versions"             -H "apikey: $SERVICE_ROLE"             -H "Authorization: Bearer $SERVICE_ROLE"             -H "Content-Type: application/json"             -H "Prefer: resolution=merge-duplicates"             -d "{\"version\":\"$VERSAO\",\"build_number\":$BUILD,\"apk_url\":\"$URL\",\"published\":true}")
          if [ "$COD" != "200" ] && [ "$COD" != "201" ]; then
            echo "::warning::O APK subiu mas app_versions NAO foi atualizada           (HTTP $COD). O botao ATUALIZAR nao vai aparecer. Resposta:"
            cat /tmp/ins.txt
            exit 0
          fi

          echo "app_versions atualizada: $VERSAO (build $BUILD)."
          echo "O botao ATUALIZAR vai aparecer na gaveta de todo mundo."

