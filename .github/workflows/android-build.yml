name: Android APK

# Gera o APK de release do Hakuna Connect com o nome padrao de distribuicao:
# legendarios<versao>.apk (ex: legendarios1.0.6.apk). A versao sai do
# pubspec.yaml, entao basta bumpar la que o nome do arquivo acompanha.
#
# O APK fica disponivel de duas formas:
#   1. como artifact da execucao (aba Actions)
#   2. como anexo de uma Release, quando a execucao e disparada por uma tag v*
#
# ASSINATURA
#
# build.gradle.kts procura chave de producao em key.properties ou nas
# variaveis de ambiente abaixo. Enquanto os secrets nao existirem, o APK
# continua saindo assinado com a chave de DEBUG: instala num aparelho com
# "fontes desconhecidas" liberado (o fluxo de distribuicao por Drive) e nao
# serve para a Play Store.
#
# Para assinar de verdade, criar estes 4 secrets no repositorio:
#   ANDROID_KEYSTORE_BASE64   o .jks inteiro em base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Gerar o keystore (uma vez, e guardar o arquivo em lugar seguro — perder e
# irreversivel):
#   keytool -genkey -v -keystore legendarios.jks -keyalg RSA \
#           -keysize 2048 -validity 10000 -alias legendarios
#   base64 -w0 legendarios.jks        # o valor do secret
#
# AVISO: trocar a chave muda a identidade do app para o Android. Quem ja tem
# o legendarios1.0.x instalado precisara DESINSTALAR antes de atualizar.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Necessario pro passo de Release conseguir criar a release e anexar o
    # APK. Sem isso o build passa e o artifact sai, mas a release falha com
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Le a versao do pubspec
        id: versao
        run: |
          VERSAO=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "numero=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "arquivo=legendarios${VERSAO}.apk" >> "$GITHUB_OUTPUT"
          echo "Versao detectada: $VERSAO -> legendarios${VERSAO}.apk"

      - run: flutter pub get

      - name: Analise estatica
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Prepara o keystore de producao (se o secret existir)
        id: assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/legendarios.jks"
            echo "caminho=$RUNNER_TEMP/legendarios.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore de PRODUCAO preparado."
          else
            echo "caminho=" >> "$GITHUB_OUTPUT"
            echo "Sem keystore: o APK sai assinado com a chave de DEBUG."
          fi

      - name: Build do APK (release)
        env:
          # Vazios quando os secrets nao existem — e o build.gradle.kts cai
          # no fallback de debug. Config pela metade nao assina: ele exige
          # os quatro valores E o arquivo no lugar.
          LEGENDARIOS_KEYSTORE_PATH: ${{ steps.assinatura.outputs.caminho }}
          LEGENDARIOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEGENDARIOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGENDARIOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Diz com qual chave o APK foi assinado
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Confere no arquivo, nao na configuracao: e o unico jeito de
          # saber o que realmente saiu. "Android Debug" no DN = chave de
          # debug.
          DN=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
               | grep -m1 'Owner:' || echo 'Owner: desconhecido')
          echo "$DN"
          if echo "$DN" | grep -q 'Android Debug'; then
            echo "::warning::APK assinado com CHAVE DE DEBUG. Instala por \
          fontes desconhecidas; nao serve para Play Store."
          fi

      - name: Renomeia para o padrao de distribuicao
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${{ steps.versao.outputs.arquivo }}"
          ls -lh "build/app/outputs/flutter-apk/${{ steps.versao.outputs.arquivo }}"

      - name: Publica o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versao.outputs.arquivo }}
          path: build/app/outputs/flutter-apk/${{ steps.versao.outputs.arquivo }}
          retention-days: 90
          if-no-files-found: error

      - name: Anexa o APK a uma Release (so quando a execucao vem de uma tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/${{ steps.versao.outputs.arquivo }}
          generate_release_notes: true
