name: Manter servidor acordado

# POR QUE ISTO EXISTE
#
# Em 20/11/2026 ninguém conseguiu entrar no app: o projeto Supabase do plano
# gratuito foi PAUSADO por inatividade (cerca de 7 dias sem nenhuma chamada).
# Projeto pausado não responde a nada, então o login falha para todo mundo.
#
# Este workflow faz uma leitura mínima (1 linha de app_versions) a cada 2
# dias, às 09:17 UTC. Dois dias deixam folga de 3x sobre os ~7 dias que a
# pausa leva, então até duas execucoes seguidas podem falhar sem que o
# projeto pause. É de graça: roda no GitHub Actions, sem servidor nosso.
#
# SE O SERVIDOR JÁ ESTIVER PAUSADO, o passo 1 falha e o GitHub manda e-mail
# ao dono por causa do job vermelho. É esse o aviso. Para resolver: entrar em
# supabase.com, abrir o projeto e clicar em "Restore project".
#
# Usa os secrets SUPABASE_URL e SUPABASE_ANON_KEY que o android-build.yml já
# usa. Nenhum segredo novo, e a chave nunca é impressa.

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

# actions: write só para o passo 2 (reabilitar este próprio workflow).
permissions:
  actions: write
  contents: read

jobs:
  cutucar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # --fail-with-body: resposta 4xx/5xx derruba o passo em vez de
          # passar calada. O corpo vai para um arquivo e, só se falhar, o log
          # mostra o status e os primeiros 300 bytes dele (a resposta do
          # servidor nunca contém a chave, que só vai nos headers).
          if ! curl --silent --show-error --fail-with-body \
               --retry 3 --max-time 30 \
               -H "apikey: $ANON" \
               -H "Authorization: Bearer $ANON" \
               -o "$RUNNER_TEMP/resposta" \
               -w 'HTTP %{http_code}\n' \
               "$SUPABASE_URL/rest/v1/app_versions?select=build_number&limit=1"; then
            head -c 300 "$RUNNER_TEMP/resposta" 2>/dev/null || true
            echo
            echo "::error::O servidor Supabase não respondeu. Provavelmente foi pausado por inatividade. Entre em supabase.com, abra o projeto e clique em Restore project."
            exit 1
          fi
          echo "Servidor respondeu."

      # O GitHub desliga workflows agendados de repositório público depois de
      # 60 dias sem commit. Reabilitar pela API reinicia essa contagem, então
      # o próprio workflow se mantém vivo. Roda mesmo se o passo 1 falhar.
      #
      # continue-on-error, e não "|| true": o "|| true" engolia a falha e o
      # passo saía verde mesmo sem reabilitar nada — a contagem de 60 dias
      # correria sem ninguém saber. Assim o passo aparece com aviso, mas não
      # pinta o job de vermelho nem esconde o resultado do passo 1, que é o
      # aviso que importa (servidor fora).
      - name: Reabilitar este workflow (reinicia a contagem de 60 dias)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api -X PUT \
               repos/${{ github.repository }}/actions/workflows/manter_servidor_acordado.yml/enable; then
            echo "::warning::Não foi possível reabilitar este workflow pela API. Ele continua rodando, mas o GitHub pode desligá-lo depois de 60 dias sem commit no repositório. Confira em Actions se ele ainda está habilitado."
            exit 1
          fi
          echo "Workflow reabilitado."
