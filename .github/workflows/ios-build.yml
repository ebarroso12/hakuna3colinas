name: iOS build (unsigned, simulator)

# Build não-assinado do app iOS. Sem conta Apple Developer / certificado de
# distribuição não dá pra gerar um .ipa instalável em iPhone real — isso aqui
# gera um Runner.app que só roda no iOS Simulator (dentro de um Mac).
on:
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build iOS (simulator, unsigned)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build ios --debug --simulator --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Zip Runner.app
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: hakuna-connect-ios-simulator
          path: build/ios/iphonesimulator/Runner-simulator.zip
          retention-days: 14
