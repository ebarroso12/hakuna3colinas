# ML Kit do mobile_scanner: modelo EMBUTIDO, de proposito.
#
# O mobile_scanner aceita `dev.steenbakker.mobile_scanner.useUnbundled=true`,
# que troca o modelo embutido pelo do Google Play Services e tira ~16 MB do
# APK (v1.0.17 tinha 60 MB; a v1.0.18, com o modelo embutido, tem 76 MB).
#
# NAO LIGUE ESSA FLAG. O modelo do Play Services e baixado pela REDE no
# primeiro uso. O QR existe como contingencia de quando o NFC falha no mato,
# sem sinal - se ele mesmo precisar de rede para funcionar na primeira vez,
# nao e contingencia nenhuma, e a descoberta disso acontece com um paciente
# na frente.
#
# Se o tamanho do APK virar problema, o caminho e `--split-per-abi` (um APK
# por arquitetura; o de arm64 fica em torno de um terco), nao esta flag.
# ---------------------------------------------------------------------------
